<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 틀린 그림 찾기 게임</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, sans-serif;
      background: #fbf7ee;
      color: #2d3436;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      user-select: none;
      padding: 10px;
    }
    header {
      width: 100%;
      max-width: 940px;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .pill {
      background: #ff4757;
      color: white;
      font-size: 18px;
      font-weight: 800;
      padding: 6px 18px;
      border-radius: 30px;
      box-shadow: 0 4px 10px rgba(255, 71, 87, 0.3);
    }
    .score { font-size: 18px; font-weight: 700; }
    .score span { color: #ff4757; font-size: 24px; }
    .btn {
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      border: 2px solid #e0d6c3;
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      margin-left: 4px;
      transition: all 0.2s;
    }
    .btn:hover { background: #f1ede2; }
    .btn-admin { background: #3742fa; color: white; border-color: #3742fa; }
    .btn-admin:hover { background: #2f3542; }

    .board {
      display: flex;
      gap: 16px;
      background: #fff;
      padding: 16px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
      margin-top: 6px;
    }
    .card {
      position: relative;
      width: 440px;
      height: 440px;
      border-radius: 14px;
      overflow: hidden;
      border: 3px solid #eee5d3;
      background: #eef2f3;
      cursor: crosshair;
    }
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: block;
    }
    .tag {
      position: absolute;
      top: 10px; left: 10px;
      background: rgba(45, 52, 54, 0.8);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      pointer-events: none;
      z-index: 10;
    }

    .t-wrap {
      width: 100%;
      max-width: 890px;
      height: 20px;
      background: #e9dfcb;
      border-radius: 10px;
      margin-top: 16px;
      position: relative;
    }
    .t-fill {
      height: 100%;
      width: 100%;
      background: #ffa502;
      border-radius: 10px;
      transition: width 0.1s linear;
    }
    .t-ele {
      position: absolute;
      top: -22px;
      left: 100%;
      transform: translateX(-50%);
      font-size: 28px;
      transition: left 0.1s linear;
    }

    /* 관리자 사진 등록 모달 */
    .admin-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-box {
      background: #fff;
      padding: 24px;
      border-radius: 16px;
      width: 90%;
      max-width: 440px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    .modal-box h3 { margin-bottom: 12px; font-size: 18px; }
    .modal-box label { display: block; margin: 12px 0 4px; font-weight: bold; font-size: 14px; }
    .modal-box input[type="file"], .modal-box select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }
    .btn-apply { background: #2ed573; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; }

    /* 팝업 창 (성공 / 시간초과) */
    .popup {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      padding: 28px 40px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      text-align: center;
      z-index: 90;
      min-width: 320px;
    }
    .popup h2 { font-size: 26px; margin-bottom: 8px; }
    .popup p { font-size: 15px; color: #555; }
    .popup-btns {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
    }
    .btn-next { background: #ff4757; color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    .btn-retry { background: #747d8c; color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div class="pill" id="stgBadge">1단계</div>
    <div class="score">남은 곳: <span id="remCount">5</span> / 5</div>
    <div>
      <button class="btn" id="bgmBtn">🎵 BGM</button>
      <button class="btn btn-admin" id="openAdminBtn">⚙️ 관리자 사진 등록</button>
    </div>
  </header>

  <div class="board">
    <div class="card">
      <div class="tag">원본 (Left)</div>
      <canvas id="lView" width="440" height="440" style="z-index:1"></canvas>
      <canvas id="lEff" width="440" height="440" style="z-index:2"></canvas>
    </div>
    <div class="card">
      <div class="tag">틀린그림 (Right)</div>
      <canvas id="rView" width="440" height="440" style="z-index:1"></canvas>
      <canvas id="rEff" width="440" height="440" style="z-index:2"></canvas>
    </div>
  </div>

  <div class="t-wrap">
    <div class="t-fill" id="tFill"></div>
    <div class="t-ele" id="tEle">🐘</div>
  </div>

  <!-- 관리자 사진 업로드 모달 -->
  <div class="admin-modal" id="adminModal">
    <div class="modal-box">
      <h3>🖼️ 관리자 사진 등록 & 5곳 자동 변형</h3>
      <p style="font-size:12px; color:#666; margin-bottom:12px;">어떤 사진이든 첨부하면 오른쪽 그림에 5곳의 차이점과 판정 좌표를 자동 생성합니다.</p>
      
      <label>1. 사진 파일 첨부 (JPG/PNG):</label>
      <input type="file" id="photoInput" accept="image/*">

      <label>2. 난이도 단계 선택:</label>
      <select id="stageSelect">
        <option value="1">1단계 (쉬움 - 뚜렷한 색상 변화)</option>
        <option value="2">2단계 (보통 - 사물 반전/변형)</option>
        <option value="3">3단계 (중급 - 톤 및 텍스처 변화)</option>
        <option value="4">4단계 (고급 - 형태 미세 왜곡)</option>
        <option value="5">5단계 (달인 - 초미세 디테일 차이)</option>
      </select>

      <div class="modal-actions">
        <button class="btn" onclick="document.getElementById('adminModal').style.display='none'">닫기</button>
        <button class="btn-apply" id="applyPhotoBtn">✨ 5곳 자동 변형 적용</button>
      </div>
    </div>
  </div>

  <!-- 클리어 팝업 -->
  <div class="popup" id="popClear">
    <h2 style="color:#ff4757;">참 잘했어요! 🎉</h2>
    <p>5곳의 차이점을 모두 찾았습니다!</p>
    <div class="popup-btns">
      <button class="btn-next" id="clearNextBtn">다음 단계 도전</button>
    </div>
  </div>

  <!-- [추가] 시간 초과 (정답 공개) 팝업 -->
  <div class="popup" id="popTimeout">
    <h2 style="color:#e67e22;">⏰ 시간 초과! (정답 공개)</h2>
    <p>못 찾으신 곳을 빨간 원으로 모두 표시했습니다.<br>화면의 정답을 확인해보세요!</p>
    <div class="popup-btns">
      <button class="btn-retry" id="timeoutRetryBtn">🔄 다시 도전</button>
      <button class="btn-next" id="timeoutNextBtn">⏩ 다음 단계</button>
    </div>
  </div>

  <script>
    // 음향 시스템
    let actx = null, bgm = false, bid = null;
    function getA() {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      return actx;
    }
    function beep(f, d, t = 'sine') {
      try {
        let c = getA(), o = c.createOscillator(), g = c.createGain();
        o.type = t; o.frequency.value = f;
        g.gain.setValueAtTime(0.08, c.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
        o.connect(g); g.connect(c.destination);
        o.start(); o.stop(c.currentTime + d);
      } catch (e) {}
    }
    const sOk = () => { beep(523, 0.1, 'triangle'); setTimeout(() => beep(659, 0.1), 70); setTimeout(() => beep(783, 0.2), 140); };
    const sNo = () => beep(160, 0.2, 'sawtooth');
    const sTimeOut = () => { beep(350, 0.15, 'sawtooth'); setTimeout(() => beep(250, 0.3, 'sawtooth'), 120); };

    document.getElementById('bgmBtn').onclick = () => {
      getA();
      bgm = !bgm;
      if (bgm) {
        let n = [261, 329, 392, 523, 440, 349, 392, 329], i = 0;
        bid = setInterval(() => { beep(n[i % n.length], 0.15, 'sine'); i++; }, 260);
        document.getElementById('bgmBtn').innerText = '🔇 BGM 끄기';
      } else {
        clearInterval(bid);
        document.getElementById('bgmBtn').innerText = '🎵 BGM';
      }
    };

    let cStg = 1;
    let diffs = [];
    let tmr = 60;
    let maxTime = 60;
    let tid = null;
    let isGameOver = false; // 시간 초과나 클리어 시 클릭 차단
    let uploadedImage = null;

    const lC = document.getElementById('lView').getContext('2d');
    const rC = document.getElementById('rView').getContext('2d');
    const lE = document.getElementById('lEff').getContext('2d');
    const rE = document.getElementById('rEff').getContext('2d');

    // 사진 5곳 변형 및 렌더링
    function processAndRender(stage) {
      cStg = stage;
      maxTime = Math.max(35, 65 - (stage * 5));
      tmr = maxTime;
      isGameOver = false;

      // 팝업 닫기
      document.getElementById('popClear').style.display = 'none';
      document.getElementById('popTimeout').style.display = 'none';

      lC.clearRect(0, 0, 440, 440);
      rC.clearRect(0, 0, 440, 440);
      lE.clearRect(0, 0, 440, 440);
      rE.clearRect(0, 0, 440, 440);

      if (uploadedImage) {
        lC.drawImage(uploadedImage, 0, 0, 440, 440);
        rC.drawImage(uploadedImage, 0, 0, 440, 440);
      } else {
        drawDefaultIllustration(lC);
        drawDefaultIllustration(rC);
      }

      const radius = Math.max(16, 36 - (stage * 4));
      const basePoints = [
        { x: 90,  y: 90 },
        { x: 340, y: 100 },
        { x: 220, y: 220 },
        { x: 110, y: 340 },
        { x: 330, y: 330 }
      ];

      diffs = [];

      basePoints.forEach((pt, idx) => {
        diffs.push({ id: idx + 1, x: pt.x, y: pt.y, r: radius, f: false });

        const imgData = rC.getImageData(pt.x - radius, pt.y - radius, radius * 2, radius * 2);
        const d = imgData.data;

        for (let i = 0; i < d.length; i += 4) {
          if (stage === 1) {
            d[i] = 255 - d[i];
            d[i + 1] = (d[i + 1] + 120) % 255;
          } else if (stage === 2) {
            let temp = d[i];
            d[i] = d[i + 2];
            d[i + 2] = temp;
          } else if (stage === 3) {
            d[i] = Math.min(255, d[i] * 1.5);
            d[i + 1] = Math.max(0, d[i + 1] * 0.6);
          } else if (stage === 4) {
            d[i] = (d[i] + 40) % 255;
          } else {
            d[i] = Math.min(255, d[i] + 25);
            d[i + 1] = Math.min(255, d[i + 1] + 25);
          }
        }
        rC.putImageData(imgData, pt.x - radius, pt.y - radius);
      });

      document.getElementById('stgBadge').innerText = `${stage}단계`;
      document.getElementById('remCount').innerText = 5;
      startT(maxTime);
    }

    function drawDefaultIllustration(ctx) {
      ctx.fillStyle = "#87ceeb"; ctx.fillRect(0, 0, 440, 250);
      ctx.fillStyle = "#6ab04c";
      ctx.beginPath(); ctx.arc(100, 280, 160, 0, Math.PI, true); ctx.fill();
      ctx.beginPath(); ctx.arc(350, 290, 180, 0, Math.PI, true); ctx.fill();
      ctx.fillStyle = "#badc58"; ctx.fillRect(0, 240, 440, 200);

      ctx.fillStyle = "#ff5252"; ctx.beginPath(); ctx.arc(90, 90, 28, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#f6e58d"; ctx.fillRect(300, 150, 80, 60);
      ctx.fillStyle = "#eb3b5a"; ctx.beginPath(); ctx.moveTo(290, 150); ctx.lineTo(340, 110); ctx.lineTo(390, 150); ctx.fill();
      ctx.fillStyle = "#d1d8e0"; ctx.beginPath(); ctx.arc(220, 220, 35, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#3867d6"; ctx.fillRect(195, 250, 50, 50);
      ctx.fillStyle = "#795548"; ctx.beginPath(); ctx.ellipse(110, 350, 40, 14, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#f1f2f6"; ctx.beginPath(); ctx.arc(110, 335, 20, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#ff9ff3"; ctx.beginPath(); ctx.arc(330, 330, 16, 0, Math.PI*2); ctx.fill();
    }

    // 빨간 동그라미 그리기 함수
    function drawFoundCircle(x, y, r, isMissed = false) {
      [lE, rE].forEach(c => {
        c.strokeStyle = isMissed ? '#e67e22' : '#ff4757'; // 못 찾은 정답은 주황빛 빨강으로 강조
        c.lineWidth = 4;
        c.beginPath();
        c.arc(x, y, r + 6, 0, Math.PI * 2);
        c.stroke();
      });
    }

    // 클릭 감지 및 정답 판정
    function check(x, y) {
      if (isGameOver) return;
      getA();
      let hit = false;
      diffs.forEach(d => {
        if (!d.f) {
          const dist = Math.hypot(d.x - x, d.y - y);
          if (dist <= d.r + 14) {
            d.f = true;
            hit = true;
            drawFoundCircle(d.x, d.y, d.r, false);
            sOk();
          }
        }
      });

      if (!hit) {
        sNo();
        tmr = Math.max(0, tmr - 3);
      }

      const rem = diffs.filter(d => !d.f).length;
      document.getElementById('remCount').innerText = rem;

      if (rem === 0) {
        isGameOver = true;
        clearInterval(tid);
        setTimeout(() => document.getElementById('popClear').style.display = 'block', 300);
      }
    }

    // [핵심] 시간 초과 시 모든 정답을 공개하는 로직
    function handleTimeout() {
      isGameOver = true;
      clearInterval(tid);
      sTimeOut();

      // 아직 못 찾은 모든 정답 위치에 동그라미 표시 (정답 공개!)
      diffs.forEach(d => {
        drawFoundCircle(d.x, d.y, d.r, !d.f);
      });

      // 0.3초 후 정답 공개 팝업 표시
      setTimeout(() => {
        document.getElementById('popTimeout').style.display = 'block';
      }, 300);
    }

    function startT(max) {
      if (tid) clearInterval(tid);
      tid = setInterval(() => {
        tmr -= 0.1;
        const p = Math.max(0, (tmr / max) * 100);
        document.getElementById('tFill').style.width = p + '%';
        document.getElementById('tEle').style.left = p + '%';
        
        // 시간 초과 도달 시 정답 공개 함수 실행!
        if (tmr <= 0) {
          handleTimeout();
        }
      }, 100);
    }

    function bind(el) {
      el.onclick = (e) => {
        const r = el.getBoundingClientRect();
        check((e.clientX - r.left) * (440 / r.width), (e.clientY - r.top) * (440 / r.height));
      };
    }
    bind(document.getElementById('lEff'));
    bind(document.getElementById('rEff'));

    // 관리자 모달
    document.getElementById('openAdminBtn').onclick = () => {
      document.getElementById('adminModal').style.display = 'flex';
    };

    document.getElementById('applyPhotoBtn').onclick = () => {
      const fileInput = document.getElementById('photoInput');
      const stage = parseInt(document.getElementById('stageSelect').value, 10);

      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function (e) {
          const img = new Image();
          img.onload = function () {
            uploadedImage = img;
            document.getElementById('adminModal').style.display = 'none';
            processAndRender(stage);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        document.getElementById('adminModal').style.display = 'none';
        processAndRender(stage);
      }
    };

    // 팝업 버튼 이벤트
    document.getElementById('clearNextBtn').onclick = () => {
      document.getElementById('popClear').style.display = 'none';
      processAndRender(cStg < 5 ? cStg + 1 : 1);
    };

    // 시간 초과 팝업: 다시 도전
    document.getElementById('timeoutRetryBtn').onclick = () => {
      document.getElementById('popTimeout').style.display = 'none';
      processAndRender(cStg);
    };

    // 시간 초과 팝업: 다음 단계
    document.getElementById('timeoutNextBtn').onclick = () => {
      document.getElementById('popTimeout').style.display = 'none';
      processAndRender(cStg < 5 ? cStg + 1 : 1);
    };

    window.onload = () => processAndRender(1);
  </script>
</body>
</html>
