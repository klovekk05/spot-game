<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>틀린 그림 찾기 - 깃허브 관리자 센터</title>
  <style>
    body { font-family: sans-serif; background: #f1f2f6; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .card { background: white; padding: 24px; border-radius: 16px; width: 100%; max-width: 900px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    .row { display: flex; gap: 20px; margin-top: 15px; }
    .col { flex: 1; }
    .box { width: 100%; height: 380px; border: 2px dashed #bbb; border-radius: 10px; display: flex; justify-content: center; align-items: center; overflow: hidden; background: #fafafa; }
    canvas { width: 100%; height: 100%; }
    .btn { padding: 10px 18px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-ai { background: #3742fa; color: white; }
    .btn-download { background: #2ed573; color: white; font-size: 16px; width: 100%; margin-top: 20px; padding: 14px; }
  </style>
</head>
<body>

<div class="card">
  <h2>⚙️ 깃허브용 문제 제작 관리자 센터</h2>
  <p style="color:#666; font-size:14px; margin: 6px 0 16px;">
    사진을 첨부하고 [AI 5곳 변형]을 누른 뒤, 생성된 <strong>stages.json 파일</strong>을 다운로드하여 깃허브에 올리기만 하면 끝납니다!
  </p>

  <label><strong>1. 몇 단계로 등록할까요?: </strong></label>
  <select id="stageSelect" style="padding: 6px 12px; border-radius: 6px;">
    <option value="1">1단계</option>
    <option value="2">2단계</option>
    <option value="3">3단계</option>
    <option value="4">4단계</option>
    <option value="5">5단계</option>
  </select>

  <div style="margin-top: 14px;">
    <label><strong>2. 원본 사진 첨부: </strong></label>
    <input type="file" id="fileIn" accept="image/*">
  </div>

  <div class="row">
    <div class="col">
      <h4>왼쪽 원본</h4>
      <div class="box"><canvas id="lCan" width="400" height="400"></canvas></div>
    </div>
    <div class="col">
      <h4>오른쪽 AI 변형본 (5곳 자동 차이점)</h4>
      <div class="box"><canvas id="rCan" width="400" height="400"></canvas></div>
      <button class="btn btn-ai" id="aiBtn">✨ AI 5곳 변형 및 좌표 자동 생성</button>
    </div>
  </div>

  <button class="btn btn-download" id="downloadBtn">📥 stages.json 다운로드 (깃허브 저장용)</button>
</div>

<script>
  let leftImg = null;
  let diffs = [];
  const lCan = document.getElementById('lCan');
  const rCan = document.getElementById('rCan');
  const lCtx = lCan.getContext('2d');
  const rCtx = rCan.getContext('2d');

  // 기존 저장 데이터 로드용 객체
  let database = { stages: {} };

  document.getElementById('fileIn').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      leftImg = new Image();
      leftImg.onload = () => {
        lCtx.clearRect(0,0,400,400);
        lCtx.drawImage(leftImg, 0, 0, 400, 400);
      };
      leftImg.src = evt.target.result;
    };
    reader.readAsDataURL(file);
  };

  document.getElementById('aiBtn').onclick = () => {
    if (!leftImg) return alert('먼저 사진을 첨부해주세요!');
    rCtx.clearRect(0,0,400,400);
    rCtx.drawImage(leftImg, 0, 0, 400, 400);

    const stg = parseInt(document.getElementById('stageSelect').value, 10);
    const rad = 32 - (stg * 2.5);

    diffs = [
      { id: 1, x: 80,  y: 80,  r: rad },
      { id: 2, x: 320, y: 90,  r: rad },
      { id: 3, x: 200, y: 210, r: rad },
      { id: 4, x: 95,  y: 315, r: rad },
      { id: 5, x: 310, y: 310, r: rad }
    ];

    diffs.forEach((d, i) => {
      const imgData = rCtx.getImageData(d.x - d.r, d.y - d.r, d.r * 2, d.r * 2);
      const data = imgData.data;
      for (let j = 0; j < data.length; j += 4) {
        if (i % 2 === 0) data[j] = 255 - data[j];
        else data[j+1] = (data[j+1] + 90) % 255;
      }
      rCtx.putImageData(imgData, d.x - d.r, d.y - d.r);
      rCtx.strokeStyle = '#2ed573';
      rCtx.lineWidth = 2;
      rCtx.strokeRect(d.x - d.r, d.y - d.r, d.r * 2, d.r * 2);
    });

    alert('5곳의 차이점과 판정 좌표가 성공적으로 생성되었습니다!');
  };

  document.getElementById('downloadBtn').onclick = () => {
    if (!leftImg || diffs.length === 0) return alert('사진 등록과 AI 변형을 먼저 진행해주세요!');
    const stg = document.getElementById('stageSelect').value;

    database.stages[stg] = {
      leftImage: lCan.toDataURL('image/jpeg', 0.8),
      rightImage: rCan.toDataURL('image/jpeg', 0.8),
      differences: diffs
    };

    const blob = new Blob([JSON.stringify(database, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'stages.json';
    a.click();
    URL.revokeObjectURL(url);
    alert('stages.json 파일이 다운로드되었습니다! 이 파일을 깃허브 저장소에 업로드하시면 됩니다.');
  };
</script>
</body>
</html>
